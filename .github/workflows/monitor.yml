name: MovieBot seat monitor

on:
  schedule:
    # Every 15 minutes. Each run decides what is actually due (see src/schedule.mjs),
    # and finishes in seconds when nothing is active or checks are paused.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: 'Only send a test message to Telegram and a test GitHub issue'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: moviebot-seat-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ALERT_GITHUB_USER: ${{ github.repository_owner }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Send test notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_notification }}
        run: node src/test-alert.mjs

      - name: Check whether there is work to do
        id: precheck
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.send_test_notification) }}
        run: node src/precheck.mjs

      - name: Install dependencies
        if: ${{ steps.precheck.outputs.run == 'true' }}
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        if: ${{ steps.precheck.outputs.run == 'true' }}
        run: npm test

      - name: Cache Chrome for Testing
        if: ${{ steps.precheck.outputs.run == 'true' }}
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Chrome for Testing
        if: ${{ steps.precheck.outputs.run == 'true' && steps.browser-cache.outputs.cache-hit != 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Install Chrome system libraries
        if: ${{ steps.precheck.outputs.run == 'true' && steps.browser-cache.outputs.cache-hit == 'true' }}
        run: npx playwright install-deps chromium

      - name: Check Harkins seats
        if: ${{ steps.precheck.outputs.run == 'true' }}
        run: npm run monitor

      - name: Upload diagnostics
        if: ${{ always() && steps.precheck.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: moviebot-debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 5
